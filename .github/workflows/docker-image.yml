name: Docker CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel older runs of the same branch/PR when a new commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 1. Build each Docker image on its own (nothing is pushed anywhere).
  docker-build:
    name: Build ${{ matrix.name }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: frontend
            context: ./frontend
            target: runtime
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: false
          tags: utopia-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  # 2. Start the whole stack (db + api + web) and run the repo's smoke test.
  compose-smoke:
    name: Compose smoke test
    runs-on: ubuntu-latest
    needs: docker-build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # compose.yml refuses to start without these two values.
      # They only exist for this throwaway CI run.
      - name: Create .env for CI
        run: |
          {
            echo "POSTGRES_PASSWORD=ci-$(openssl rand -hex 12)"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
          } > .env

      - name: Start the stack
        run: docker compose -f compose.yml up --build -d --wait --wait-timeout 300

      - name: Show running containers
        run: docker compose -f compose.yml ps

      - name: Run smoke test
        run: python3 test/compose_smoke.py

      - name: Check data survives a restart
        run: |
          docker compose -f compose.yml restart db api
          python3 test/compose_smoke.py --verify-persistence

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f compose.yml logs --tail=200 web api db

      - name: Tear down
        if: always()
        run: docker compose -f compose.yml down -v
