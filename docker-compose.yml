services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: civicgrid
      POSTGRES_USER: civicgrid
      POSTGRES_PASSWORD: civicgrid
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicgrid"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://civicgrid:civicgrid@db:5432/civicgrid
    volumes:
      - ./backend/app:/app/app
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
  web:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports: ["5173:5173"]
    depends_on: [api]
volumes:
  pgdata:
